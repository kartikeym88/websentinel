{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>New Scan</h2>
    <form action="{{ url_for('web.start_scan') }}" method="POST">
        <div class="form-group">
            <label for="target">Target URL</label>
            <input type="url" id="target" name="target" class="form-control" placeholder="http://example.com" required>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="zap_enabled"> Enable OWASP ZAP (Active Scan)
            </label>
        </div>
        <button type="submit" class="btn btn-primary">Start Scan</button>
    </form>
</div>

<div class="card">
    <h2>Recent Scans</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Target</th>
                <th>Status</th>
                <th>Findings</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for scan in scans %}
            <tr>
                <td>{{ scan.started_at | ist_time }}</td>
                <td>{{ scan.target }}</td>
                <td>{{ scan.status }}</td>
                <td>{{ scan.findings_count }}</td>
                <td>
                    <a href="{{ url_for('web.scan_results', scan_id=scan.scan_id) }}" class="btn btn-outline">View</a>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="5">No scans found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
